name: ci
on:
  push:
    branches: [master, main, feature/**]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
      - name: Fuzz smoke
        run: go test -run '^$' -fuzz FuzzOpen -fuzztime 30s .
